<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Checks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h1>Gillespie Fire Dept Checks</h1>
<p>Full app is ready. Use the standalone HTML for the complete version.</p>
<button onclick="testPDF()">Test Export PDF</button>
<script>
function testPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Gillespie Fire Dept - Test PDF", 10, 10);
  doc.save("test.pdf");
  alert("PDF downloaded");
}
</script>
</body>
