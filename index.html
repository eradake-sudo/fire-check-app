<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apparatus & SCBA Monthly Checks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #1a1a1a;
  --surface-2: #141414;
  --border: #2a2a2a;
  --text: #ffffff;
  --text-muted: #a0a0a0;
  --accent-red: #e11d48;
  --accent-yellow: #facc15;
  --yellow-hover: #eab308;
  --radius: 10px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

header {
  background: var(--surface-2);
  padding: 1rem 1.25rem 0.75rem;
  border-bottom: 3px solid var(--accent-red);
}

.header-content {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  max-width: 1100px;
  margin: 0 auto;
}

.logo-placeholder {
  width: 52px;
  height: 52px;
  background: radial-gradient(circle at 30% 30%, #3a1a1a, #1a0a0a);
  border: 2px solid #8b0000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.7rem;
  color: var(--accent-yellow);
  text-align: center;
  line-height: 1.1;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(255,200,0,0.3);
}

h1 {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.1;
}

.subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 0.1rem;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.25rem 1rem 3rem;
}

h2 {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 1.5rem 0 0.75rem;
}

.unit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.75rem;
}

.unit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}

.unit-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--accent-red);
}

.unit-card:hover {
  background: #222;
  border-color: #3a3a3a;
  transform: translateY(-1px);
}

.unit-card h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 0.25rem;
}

.unit-card p {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.checklist-view.hidden,
.hidden {
  display: none !important;
}

.checklist-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: 1rem;
  position: relative;
}

.checklist-header::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--accent-red);
  border-radius: var(--radius) 0 0 var(--radius);
}

.meta-fields {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-top: 0.85rem;
}

.meta-fields label {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  font-size: 0.8rem;
  color: var(--text-muted);
  flex: 1;
  min-width: 160px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

input[type="text"], input[type="date"], textarea {
  background: #111;
  border: 1px solid #333;
  color: white;
  padding: 0.7rem 0.8rem;
  border-radius: 8px;
  font-size: 0.95rem;
  font-family: inherit;
  transition: border-color 0.15s, box-shadow 0.15s;
}

input:focus, textarea:focus {
  outline: none;
  border-color: var(--accent-yellow);
  box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.15);
}

.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1rem;
  overflow: hidden;
  position: relative;
}

.section::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--accent-red);
}

.section-title {
  background: #151515;
  padding: 0.75rem 1.1rem 0.75rem 1.4rem;
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}

.item-row {
  display: grid;
  grid-template-columns: 1fr 100px 1.3fr;
  gap: 0.6rem;
  padding: 0.85rem 1.1rem 0.85rem 1.4rem;
  border-bottom: 1px solid #252525;
  align-items: start;
}

.item-row:last-child {
  border-bottom: none;
}

.item-label {
  font-size: 0.9rem;
  padding-top: 0.45rem;
  line-height: 1.35;
}

.initials-input {
  width: 100%;
  text-align: center;
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.notes-input {
  width: 100%;
  min-height: 40px;
  resize: vertical;
}

.btn {
  padding: 0.85rem 1.25rem;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  
  font-family: inherit;
  text-transform: uppercase;
}

.btn.primary {
  background: var(--accent-yellow);
  color: #111;
}

.btn.primary:hover {
  background: var(--yellow-hover);
}

.btn.secondary {
  background: #2a2a2a;
  color: white;
  border: 1px solid #3a3a3a;
}

.btn.secondary:hover {
  background: #333;
}

.btn.danger {
  background: transparent;
  color: #f87171;
  border: 1px solid #7f1d1d;
}

.btn.danger:hover {
  background: rgba(239, 68, 68, 0.1);
}

.actions {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin-top: 1.25rem;
}

footer {
  text-align: center;
  padding: 1.5rem 1rem;
  color: #666;
  font-size: 0.75rem;
  border-top: 1px solid #222;
  margin-top: 2rem;
}

@media (max-width: 768px) {
  .item-row {
    grid-template-columns: 1fr;
    gap: 0.35rem;
    padding: 0.9rem 1.1rem 0.9rem 1.4rem;
  }

  .item-label {
    font-weight: 600;
    padding-top: 0;
    margin-bottom: 0.15rem;
  }

  .unit-grid {
    grid-template-columns: 1fr;
  }

  main {
    padding: 1rem 0.85rem 2.5rem;
  }

  h1 {
    font-size: 1.2rem;
  }

  .logo-placeholder {
    width: 46px;
    height: 46px;
  }
}

@media print {
  header, .actions, footer, #back-btn, .unit-select {
    display: none !important;
  }
  body {
    background: white;
    color: black;
  }
  .section, .checklist-header {
    background: white;
    border: 1px solid #ddd;
  }
  .item-row {
    border-bottom: 1px solid #eee;
  }
  input, textarea {
    border: 1px solid #ccc;
    background: white;
    color: black;
  }
  .section::before, .checklist-header::before, .unit-card::before {
    display: none;
  }
}

.check-btn {
  width: 44px;
  height: 44px;
  border: 2px solid #444;
  border-radius: 8px;
  background: #1a1a1a;
  color: transparent;
  font-size: 1.4rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  
  flex-shrink: 0;
}

.check-btn.checked {
  background: #22c55e;
  border-color: #16a34a;
  color: white;
}

.check-btn:hover {
  border-color: #666;
}

.signature-section .sig-fields {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
}

.signature-section label {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  font-size: 0.8rem;
  color: #a0a0a0;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

@media (max-width: 768px) {
  .item-row {
    grid-template-columns: 1fr auto;
    gap: 0.5rem;
  }
  .notes-input {
    grid-column: 1 / -1;
  }
}

.sig-pad-wrap {
  margin-top: 0.4rem;
}

#signature-pad {
  width: 100%;
  max-width: 400px;
  height: 160px;
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  touch-action: none;
  cursor: crosshair;
}

img.logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: contain;
  flex-shrink: 0;
  display: block;
  background: transparent;
}
</style>
</head>

const scbaItems = [

let currentUnit = null;
let signaturePad = null;

function init() {
  renderUnitGrid();
  document.getElementById('back-btn').addEventListener('click', showUnitSelect);
  document.getElementById('print-btn').addEventListener('click', () => window.print());
  document.getElementById('export-pdf-btn').addEventListener('click', exportPDF);
  document.getElementById('clear-btn').addEventListener('click', clearForm);
}

function renderUnitGrid() {
  const grid = document.getElementById('unit-grid');
  grid.innerHTML = '';
  Object.entries(checklists).sort((a, b) => a[1].name.localeCompare(b[1].name)).forEach(([id, data]) => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `<h3>${data.name}</h3><p>Click to start check</p>`;
    card.addEventListener('click', () => loadChecklist(id));
    grid.appendChild(card);
  });
}

function showUnitSelect() {
  document.getElementById('unit-select').classList.remove('hidden');
  document.getElementById('checklist-view').classList.add('hidden');
  currentUnit = null;
}

function loadChecklist(unitId) {
  currentUnit = unitId;
  const data = checklists[unitId];
  document.getElementById('checklist-title').textContent = data.name;
  document.getElementById('unit-select').classList.add('hidden');
  document.getElementById('checklist-view').classList.remove('hidden');
  renderChecklist(data);
  initSignaturePad();
}

function renderChecklist(data) {
  const container = document.getElementById('checklist-content');
  container.innerHTML = '';

  if (data.mainItems.length > 0) {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<div class="section-title">Apparatus Checks</div>`;
    data.mainItems.forEach((item, idx) => section.appendChild(createItemRow(item, `main-${idx}`)));
    container.appendChild(section);
  }

  for (let i = 0; i < data.scbaPacks; i++) {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<div class="section-title">SCBA Pack #${i + 1}</div>`;
    scbaItems.forEach((item, j) => section.appendChild(createItemRow(item, `pack-${i}-${j}`)));
    container.appendChild(section);
  }

  for (let i = 0; i < data.scbaBottles; i++) {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<div class="section-title">SCBA Bottle #${i + 1}</div>`;
    scbaItems.forEach((item, j) => section.appendChild(createItemRow(item, `bottle-${i}-${j}`)));
    container.appendChild(section);
  }

  const sigSection = document.createElement('div');
  sigSection.className = 'section signature-section';
  sigSection.innerHTML = `
    <div class="section-title">Completed By</div>
    <div class="sig-fields">
      <label>Printed Name <input type="text" id="completed-by" placeholder="Full name"></label>
      <label>Date <input type="date" id="check-date"></label>
      <label>Signature
        <div class="sig-pad-wrap">
          <canvas id="signature-pad" width="400" height="160"></canvas>
          <button type="button" id="clear-sig" class="btn secondary" style="margin-top:0.5rem;font-size:0.8rem;padding:0.4rem 0.8rem;">Clear Signature</button>
        </div>
      </label>
    </div>
  `;
  container.appendChild(sigSection);
}

function initSignaturePad() {
  const canvas = document.getElementById('signature-pad');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let drawing = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function start(e) { e.preventDefault(); drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  document.getElementById('clear-sig').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  signaturePad = { canvas, ctx };
}

function createItemRow(label, key) {
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <div class="item-label">${label}</div>
    <button type="button" class="check-btn" data-key="${key}"></button>
    <textarea class="notes-input" data-key="${key}" placeholder="Notes"></textarea>
  `;
  const btn = row.querySelector('.check-btn');
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    const isChecked = !this.classList.contains('checked');
    this.classList.toggle('checked', isChecked);
    this.textContent = isChecked ? '✓' : '';
  });
  return row;
}

function collectFormData() {
  const items = {};
  document.querySelectorAll('.check-btn').forEach(btn => {
    const key = btn.dataset.key;
    if (!items[key]) items[key] = {};
    items[key].checked = btn.classList.contains('checked');
  });
  document.querySelectorAll('.notes-input').forEach(el => {
    const key = el.dataset.key;
    if (!items[key]) items[key] = {};
    items[key].notes = el.value.trim();
  });
  const sig = signaturePad ? signaturePad.canvas.toDataURL() : '';
  return {
    items,
    completedBy: document.getElementById('completed-by')?.value.trim() || '',
    signature: sig,
    date: document.getElementById('check-date')?.value || '',
    unit: currentUnit,
    unitName: checklists[currentUnit]?.name || currentUnit,
    timestamp: new Date().toISOString()
  };
}

function clearForm() {
  if (!confirm('Clear all entries on this form?')) return;
  document.querySelectorAll('.check-btn').forEach(btn => { btn.classList.remove('checked'); btn.textContent = ''; });
  document.querySelectorAll('.notes-input').forEach(el => el.value = '');
  document.getElementById('completed-by').value = '';
  if (signaturePad) signaturePad.ctx.clearRect(0, 0, signaturePad.canvas.width, signaturePad.canvas.height);
}

async function exportPDF() {
  if (!currentUnit) { alert('Select a unit first.'); return; }
  const btn = document.getElementById('export-pdf-btn');
  const originalText = btn.textContent;
  btn.textContent = 'Generating...';
  btn.disabled = true;
  try {
    const data = collectFormData();
    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert('PDF library failed to load. Check your internet connection and try again.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 12;

    // Header bar
    doc.setFillColor(20, 20, 20);
    doc.rect(0, 0, pageW, 22, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(14);
    doc.setFont(undefined, 'bold');
    doc.text('GILLESPIE FIRE DEPT', margin, 10);
    doc.setFontSize(9);
    doc.setFont(undefined, 'normal');
    doc.text('Monthly Apparatus & SCBA Check', margin, 16);

    doc.setTextColor(0, 0, 0);
    let y = 30;

    // Unit title
    doc.setFontSize(13);
    doc.setFont(undefined, 'bold');
    doc.text(data.unitName || 'Apparatus Check', margin, y);
    y += 7;
    doc.setFontSize(9);
    doc.setFont(undefined, 'normal');
    doc.text(`Date: ${data.date || '—'}     Completed by: ${data.completedBy || '—'}`, margin, y);
    y += 8;

    // Table header
    doc.setFillColor(40, 40, 40);
    doc.rect(margin, y - 4, pageW - margin * 2, 7, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(8);
    doc.setFont(undefined, 'bold');
    doc.text('ITEM', margin + 8, y);
    doc.text('NOTES', margin + 100, y);
    doc.setTextColor(0, 0, 0);
    y += 6;

    const allItems = [];
    const unit = checklists[currentUnit];
    if (unit.mainItems) unit.mainItems.forEach((label, i) => allItems.push({ label, key: `main-${i}`, section: 'Apparatus' }));
    for (let p = 0; p < (unit.scbaPacks || 0); p++) {
      scbaItems.forEach((label, i) => allItems.push({ label, key: `pack-${p}-${i}`, section: `SCBA Pack #${p+1}` }));
    }
    for (let b = 0; b < (unit.scbaBottles || 0); b++) {
      scbaItems.forEach((label, i) => allItems.push({ label, key: `bottle-${b}-${i}`, section: `SCBA Bottle #${b+1}` }));
    }

    let currentSection = '';
    allItems.forEach((item, idx) => {
      if (y > pageH - 30) {
        doc.addPage();
        y = 15;
      }
      if (item.section !== currentSection) {
        currentSection = item.section;
        y += 3;
        doc.setFont(undefined, 'bold');
        doc.setFontSize(9);
        doc.setTextColor(180, 30, 50);
        doc.text(currentSection.toUpperCase(), margin, y);
        doc.setTextColor(0, 0, 0);
        y += 5;
      }

      const entry = data.items[item.key] || {};
      const checked = entry.checked;
      const notes = entry.notes || '';

      // Row background
      if (idx % 2 === 0) {
        doc.setFillColor(248, 248, 248);
        doc.rect(margin, y - 3.5, pageW - margin * 2, 6, 'F');
      }

      // Checkmark box
      doc.setDrawColor(100);
      doc.setLineWidth(0.3);
      doc.rect(margin, y - 3, 4, 4);
      if (checked) {
        doc.setFillColor(34, 197, 94);
        doc.rect(margin + 0.5, y - 2.5, 3, 3, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(7);
        doc.text('✓', margin + 0.8, y);
        doc.setTextColor(0, 0, 0);
      }

      // Item label
      doc.setFont(undefined, 'normal');
      doc.setFontSize(8);
      const labelLines = doc.splitTextToSize(item.label, 85);
      doc.text(labelLines, margin + 6, y);

      // Notes
      if (notes) {
        const noteLines = doc.splitTextToSize(notes, 70);
        doc.setTextColor(80);
        doc.text(noteLines, margin + 100, y);
        doc.setTextColor(0, 0, 0);
      }

      y += Math.max(labelLines.length, notes ? doc.splitTextToSize(notes, 70).length : 1) * 4 + 1;
    });

    // Signature section
    if (y > pageH - 45) { doc.addPage(); y = 15; }
    y += 8;
    doc.setDrawColor(200);
    doc.line(margin, y, pageW - margin, y);
    y += 6;
    doc.setFont(undefined, 'bold');
    doc.setFontSize(9);
    doc.text('SIGNATURE', margin, y);
    y += 4;

    if (data.signature && data.signature.length > 100 && data.signature.startsWith('data:image')) {
      try {
        doc.addImage(data.signature, 'PNG', margin, y, 55, 22);
        y += 26;
      } catch (e) {
        doc.setFont(undefined, 'italic');
        doc.setFontSize(8);
        doc.text('(Signature could not be rendered)', margin, y + 4);
        y += 10;
      }
    } else {
      doc.setDrawColor(180);
      doc.rect(margin, y, 55, 18);
      doc.setFont(undefined, 'italic');
      doc.setFontSize(8);
      doc.setTextColor(150);
      doc.text('No signature', margin + 2, y + 10);
      doc.setTextColor(0, 0, 0);
      y += 22;
    }

    doc.setFont(undefined, 'normal');
    doc.setFontSize(8);
    doc.text(`Printed name: ${data.completedBy || '—'}`, margin, y);
    y += 5;
    doc.text(`Date: ${data.date || '—'}`, margin, y);

    // Footer
    doc.setFontSize(7);
    doc.setTextColor(150);
    doc.text('Gillespie Fire Dept • Monthly Apparatus Check', margin, pageH - 8);

    doc.save(`${(data.unitName || 'check').replace(/[^a-z0-9]+/gi, '_')}_${data.date || 'undated'}.pdf`);
  } catch (err) {
    console.error(err);
    alert('PDF export failed: ' + (err.message || 'Unknown error'));
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}
